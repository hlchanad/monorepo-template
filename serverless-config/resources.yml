Conditions:
  CreateCloudFront:
    Fn::Equals:
      - ${self:custom.config.DOMAIN_ENABLED}
      - true

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ${self:custom.config.VARS.SITE_BUCKET}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: "arn:aws:s3:::${self:custom.config.VARS.SITE_BUCKET}/*"

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - ${self:custom.config.SITE_ALIAS_DOMAIN}
        ViewerCertificate:
          AcmCertificateArn: ${self:custom.config.ACM_CERTIFICATE_ARN_GLOBAL}
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
        Origins:
          - Id: S3Origin
            DomainName: ${self:custom.config.VARS.SITE_BUCKET}.s3-website.${self:provider.region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
          - Id: ApiOrigin
            DomainName:
              Fn::Sub: "${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: "/${self:provider.stage}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CacheBehaviors:
          - PathPattern: api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            ForwardedValues:
              QueryString: true
              Headers:
                - Accept
                - Authorization
                - Content-Type
                - Origin
                - Access-Control-Request-Headers
                - Access-Control-Request-Method
              Cookies:
                Forward: none

  WebsiteDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateCloudFront
    Properties:
      HostedZoneName: chanhonlun.com.
      Name: ${self:custom.config.SITE_ALIAS_DOMAIN}.
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebsiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false
